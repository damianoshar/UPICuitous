<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>UPICuitous — web sketch</title>
<style>
  body{background:#0b0b0e;color:#c9c9d4;font-family:system-ui,sans-serif;margin:0;padding:12px}
  #score{width:100%;height:420px;background:#101014;border:1px solid #34343f;touch-action:none;cursor:crosshair}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center}
  button{background:#1e1e26;color:#fff;border:1px solid #34343f;border-radius:6px;padding:6px 10px;cursor:pointer}
  button:hover{background:#2a2a35}
  select,input[type=range]{background:#1e1e26;color:#fff;border:1px solid #34343f;border-radius:6px;padding:4px}
  canvas.small{width:100%;height:140px;background:#141419;border:1px solid #34343f}
  .col{flex:1;min-width:280px}
  label{font-size:12px;color:#9a9aa5}
</style>
</head>
<body>
<h2>UPICuitous — web sketch (Xenakis)</h2>
<div class="row">
  <button id="play">Play</button>
  <button id="stop">Stop</button>
  <button id="render">Render WAV</button>
  <button id="clear">Clear</button>
  <button id="demo">Demo</button>
  <label>Wave <select id="wave"><option value="0">0 sine</option><option value="1">1 saw</option><option value="2">2 square</option></select></label>
  <label>Env <select id="env"><option value="0">0 flat</option><option value="1">1 perc</option><option value="2">2 swell</option></select></label>
  <label>Inten <input id="inten" type="range" min="0.05" max="1" step="0.01" value="0.8"/></label>
  <label>Dur <input id="dur" type="range" min="5" max="60" step="1" value="30"/></label>
  <label><input id="snap" type="checkbox" checked/> snap</label>
  <span id="status"></span>
</div>
<canvas id="score"></canvas>
<div class="row">
  <div class="col"><label>Wavetable (sine/saw/square preset via dropdown above; drawn on score only in this sketch)</label></div>
</div>
<script>
// Minimal UPIC: draw arcs on score, WebAudio wavetable synth.
const MINF=20, MAXF=12000;
const midi2f=m=>440*Math.pow(2,(m-69)/12);
const f2m=f=>69+12*Math.log2(Math.max(MINF,Math.min(MAXF,f))/440);
const f2n=f=>{const lo=Math.log2(MINF),hi=Math.log2(MAXF);return Math.max(0,Math.min(1,(Math.log2(Math.max(MINF,Math.min(MAXF,f)))-lo)/(hi-lo)));};
const n2f=n=>{n=Math.max(0,Math.min(1,n));const lo=Math.log2(MINF),hi=Math.log2(MAXF);return Math.pow(2,lo+n*(hi-lo));};
let arcs=[], nextId=1, audioCtx=null, nodes=[], playheadTimer=null;
const score=document.getElementById('score'), ctx=score.getContext('2d');
const status=document.getElementById('status');
function resize(){score.width=score.clientWidth;score.height=420;draw();}
window.addEventListener('resize',resize);
function quant(f){if(!document.getElementById('snap').checked)return f;let m=Math.round(f2m(f));m=Math.max(12,Math.min(120,m));return midi2f(m);}
function draw(){
  const W=score.width,H=score.height,dur=+document.getElementById('dur').value;
  ctx.fillStyle='#101014';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#2a2a35';ctx.fillStyle='#8a8a99';ctx.font='10px sans-serif';
  for(let s=0;s<=dur;s+=Math.max(1,Math.round(dur/10))){const x=s/dur*W;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();ctx.fillText(s+'s',x+3,H-6);}
  for(let m=12;m<=120;m++){const f=midi2f(m);if(f<MINF||f>MAXF)continue;const isC=m%12===0;if(!(isC||m===69))continue;
    const y=H-f2n(f)*H;ctx.strokeStyle=m===69?'#ff9f0a':'#3a3a4d';ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
    ctx.fillStyle='#8a8a99';ctx.fillText('m'+m,4,y-3);}
  const cols=['#5ac8fa','#ff9f0a','#ff375f'];
  for(const a of arcs){ctx.strokeStyle=cols[a.wave%3];ctx.lineWidth=2;ctx.beginPath();
    a.points.forEach(([t,f],i)=>{const x=t/dur*W,y=H-f2n(f)*H;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();}
  status.textContent=`arcs=${arcs.length} dur=${dur}s`;
}
function demo(){arcs=[
  {id:nextId++,wave:0,env:0,inten:.8,points:[[0,110],[6,220],[12,440],[18,330],[24,440]]},
  {id:nextId++,wave:1,env:1,inten:.7,points:[[2,880],[8,660],[14,990],[22,1320]]},
  {id:nextId++,wave:2,env:1,inten:.5,points:[[10,523],[11,587],[12,659],[13,784],[16,1046]]}];draw();}
let drawing=false,pts=[];
score.addEventListener('pointerdown',e=>{drawing=true;pts=[[e.offsetX,e.offsetY]];score.setPointerCapture(e.pointerId);});
score.addEventListener('pointermove',e=>{if(drawing)pts.push([e.offsetX,e.offsetY]);});
score.addEventListener('pointerup',e=>{
  drawing=false;const W=score.width,H=score.height,dur=+document.getElementById('dur').value;
  pts.push([e.offsetX,e.offsetY]);pts.sort((a,b)=>a[0]-b[0]);
  const ap=[];let lastT=-1;
  for(const [x,y] of pts){const t=Math.max(0,Math.min(dur,x/W*dur));if(t<=lastT+0.015)continue;
    ap.push([t,quant(n2f(1-y/H))]);lastT=t;}
  if(ap.length>=2)arcs.push({id:nextId++,wave:+document.getElementById('wave').value,env:+document.getElementById('env').value,inten:+document.getElementById('inten').value,points:ap});
  pts=[];draw();
});
function envGain(env,t){ // t 0..1
  if(env==1)return t<0.02?t/0.02:Math.max(0,1-t);
  if(env==2)return Math.sin(Math.PI*Math.min(1,t));
  return 1;
}
function waveFn(w,ph){ph=ph%1;if(w==1)return 2*ph-1;if(w==2)return ph<0.5?1:-1;return Math.sin(2*Math.PI*ph);}
async function play(){
  stop();audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  await audioCtx.resume();
  const dur=+document.getElementById('dur').value;
  for(const a of arcs){
    const osc=audioCtx.createOscillator(); // use periodic wave approx via custom curve
    const g=audioCtx.createGain();g.gain.value=0;osc.connect(g).connect(audioCtx.destination);
    // animate freq + gain with setValueCurve
    const sr=100, n=Math.max(2,Math.floor((a.points[a.points.length-1][0]-a.points[0][0])*sr));
    const fcurve=new Float32Array(n), gcurve=new Float32Array(n);
    for(let i=0;i<n;i++){const t=a.points[0][0]+(a.points[a.points.length-1][0]-a.points[0][0])*i/(n-1);
      // interp log freq
      let f=a.points[a.points.length-1][1];
      for(let k=1;k<a.points.length;k++)if(t<=a.points[k][0]){
        const [t0,f0]=a.points[k-1],[t1,f1]=a.points[k];const u=(t-t0)/(Math.max(1e-6,t1-t0));
        f=Math.pow(2,Math.log2(Math.max(1,f0))+(Math.log2(Math.max(1,f1))-Math.log2(Math.max(1,f0)))*u);break;}
      fcurve[i]=f;
      const life=(t-a.points[0][0])/Math.max(1e-6,a.points[a.points.length-1][0]-a.points[0][0]);
      gcurve[i]=envGain(a.env,life)*a.inten*0.2;
    }
    const t0=audioCtx.currentTime+0.05+a.points[0][0];
    osc.type=a.wave==2?'square':(a.wave==1?'sawtooth':'sine');
    osc.frequency.setValueCurveAtTime(fcurve,t0,(a.points[a.points.length-1][0]-a.points[0][0]));
    g.gain.setValueCurveAtTime(gcurve,t0,(a.points[a.points.length-1][0]-a.points[0][0]));
    osc.start(t0-a.points[0][0]);osc.stop(t0+(a.points[a.points.length-1][0]-a.points[0][0])+0.1);
    nodes.push(osc);
  }
}
function stop(){for(const o of nodes){try{o.stop()}catch(e){}}nodes=[];if(audioCtx)audioCtx.suspend();}
document.getElementById('play').onclick=play;
document.getElementById('stop').onclick=stop;
document.getElementById('clear').onclick=()=>{arcs=[];draw();};
document.getElementById('demo').onclick=demo;
document.getElementById('dur').oninput=draw;
document.getElementById('render').onclick=()=>{
  // offline render to WAV (mono 44100)
  const sr=44100,dur=+document.getElementById('dur').value,N=Math.floor(dur*sr),out=new Float32Array(N);
  for(const a of arcs){let ph=0;const s=Math.floor(a.points[0][0]*sr),e=Math.min(N,Math.ceil(a.points[a.points.length-1][0]*sr));
    for(let i=s;i<e;i++){const t=i/sr;let f=a.points[a.points.length-1][1];
      for(let k=1;k<a.points.length;k++)if(t<=a.points[k][0]){const [t0,f0]=a.points[k-1],[t1,f1]=a.points[k];const u=(t-t0)/Math.max(1e-6,t1-t0);
        f=Math.pow(2,Math.log2(Math.max(1,f0))+(Math.log2(Math.max(1,f1))-Math.log2(Math.max(1,f0)))*u);break;}
      const life=(t-a.points[0][0])/Math.max(1e-6,a.points[a.points.length-1][0]-a.points[0][0]);
      out[i]+=waveFn(a.wave,ph)*envGain(a.env,life)*a.inten;ph=(ph+f/sr)%1;}}
  // tanh soft clip
  for(let i=0;i<N;i++)out[i]=Math.tanh(out[i]*0.6)*0.8;
  const buf=new ArrayBuffer(44+N*2),v=new DataView(buf);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF');v.setUint32(4,36+N*2,true);ws(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,N*2,true);
  for(let i=0;i<N;i++)v.setInt16(44+i*2,Math.max(-32768,Math.min(32767,out[i]*32767)),true);
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));a.download='upic-web.wav';a.click();
};
demo();resize();
</script>
</body>
</html>
