name: PR Validation

# Runs on every pull request and on a push to main: the same builds the
# release runs, so a broken build is caught before it reaches a tag.
#
# SECURITY (S-05): every action is pinned to a full commit SHA and the
# Gradle wrapper is validated before it runs.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    uses: ./.github/workflows/windows.yml

  android:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.1.13356709
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch JUCE
        run: python Tools/fetch_juce.py

      - name: Verify Android CMake uses fetched JUCE
        run: |
          if grep -nE '\.\./\.\./\.\./JuceLibraryCode/(modules|include_juce|JuceHeader)' Builds/Android/app/CMakeLists.txt; then
            echo "Builds/Android/app/CMakeLists.txt still points at generated JuceLibraryCode."
            echo "Run scripts/fix_android.ps1 after a Projucer resave, then commit the result."
            exit 1
          fi

      - name: Verify the Android project matches the .jucer
        shell: pwsh
        run: ./scripts/fix_android.ps1 -Verify

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(command -v sdkmanager || find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true

      - name: Install NDK and CMake
        run: |
          SDKMANAGER="$(command -v sdkmanager || find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n1)"
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" \
            "ndk;28.1.13356709" \
            "cmake;3.22.1" \
            "build-tools;35.0.0" \
            "platforms;android-35"

      - name: Build the debug APK
        working-directory: Builds/Android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          # The debug signing config points at ~/.android/debug.keystore - the
          # public Android debug key. A developer machine has that file
          # (Android Studio makes it), a CI runner does not, and gradle only
          # creates it for its own default debug config - not for the custom
          # one the project declares. The job makes it with the standard
          # parameters, so the debug APK is signed with the usual debug key.
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          # SECURITY (S-02): the release build type fails closed when the
          # release keystore is missing - and that check runs while gradle
          # *configures* the build, so every gradle invocation needs a
          # keystore.properties file to exist, even one that only builds the
          # debug APK. This job builds the DEBUG apk, which is signed with
          # the public debug key; the throwaway key below never signs
          # anything that ships, and the release key is not in this job at
          # all. Both files are removed when the step ends.
          trap 'rm -f app/keystore.properties app/throwaway.keystore' EXIT
          keytool -genkeypair -v \
            -keystore app/throwaway.keystore \
            -alias throwaway -keyalg RSA -keysize 2048 -validity 30 \
            -storepass throwaway -keypass throwaway \
            -dname "CN=throwaway, O=upicuitous-ci"
          {
            echo "storeFile=throwaway.keystore"
            echo "keyAlias=throwaway"
            echo "keyPassword=throwaway"
            echo "storePassword=throwaway"
          } > app/keystore.properties
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UPICuitous-Android-APK-debug
          path: Builds/Android/app/build/outputs/apk/debug_/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  linux:
    # The Linux and macOS builds are new: they run, but they do not block a
    # pull request until they have been green for a while. Remove the
    # continue-on-error once they are.
    continue-on-error: true
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config xvfb \
            libasound2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev

      - name: Fetch JUCE
        run: python Tools/fetch_juce.py

      - name: Configure
        run: cmake -S . -B Builds/App -DCMAKE_BUILD_TYPE=Release

      - name: Build
        # not "--parallel" without a number: that uses every core of the
        # runner, and a runner that gets no CPU cannot keep its heartbeat
        # up - the job then dies with "the hosted runner lost communication
        # with the server" half way through the build.
        run: cmake --build Builds/App --parallel 3

      - name: Self-test
        id: selftest
        # the selftest never shows a window, but JUCE still wants a display
        # on Linux - xvfb provides a virtual one.
        #
        # The step itself does not fail the job: the check below reads the
        # log and reports what failed. Otherwise the log - the only place
        # the failing check is named - would be lost, because the job stops
        # at the first failure.
        continue-on-error: true
        run: xvfb-run -a ./Builds/App/UPICuitous_artefacts/Release/UPICuitous --selftest

      - name: Check the selftest result
        run: |
          set -euo pipefail
          LOG="${TMPDIR:-/tmp}/upic_selftest.txt"
          if [ ! -f "$LOG" ]; then
            echo "the selftest wrote no log ($LOG)"
            exit 1
          fi
          if grep -q '^FAIL' "$LOG"; then
            cat "$LOG"
            exit 1
          fi
          if [ "${{ steps.selftest.outcome }}" != "success" ]; then
            echo "the selftest exited ${{ steps.selftest.outcome }} without a FAIL line"
            tail -40 "$LOG"
            exit 1
          fi
          echo "the selftest passed"

  macos:
    continue-on-error: true
    # the macOS 14 image was retired on 2026-11-02 - the label now points
    # at a configuration that no runner offers. The arm64 images
    # (macos-15, macos-latest) are often out of capacity for public
    # repositories, so the job asks for the Intel image.
    runs-on: macos-15-intel
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Fetch JUCE
        run: python Tools/fetch_juce.py

      - name: Configure
        run: cmake -S . -B Builds/App -DCMAKE_BUILD_TYPE=Release

      - name: Build
        # three jobs, not one per core: a runner that gets no CPU cannot
        # keep its heartbeat up, and the job dies half way through
        run: cmake --build Builds/App --parallel 3

      - name: Self-test
        id: selftest
        # the check below reads the log and reports what failed - the step
        # itself does not stop the job, or the log would be lost
        continue-on-error: true
        run: |
          # on macOS the app is a bundle, so the binary sits inside it
          APP="./Builds/App/UPICuitous_artefacts/Release/UPICuitous.app/Contents/MacOS/UPICuitous"
          if [ ! -x "$APP" ]; then
            echo "the app bundle is not where it should be:"
            find Builds/App/UPICuitous_artefacts -maxdepth 4
            exit 1
          fi
          "$APP" --selftest

      - name: Check the selftest result
        run: |
          set -euo pipefail
          LOG="${TMPDIR:-/tmp}/upic_selftest.txt"
          if [ ! -f "$LOG" ]; then
            echo "the selftest wrote no log ($LOG)"
            exit 1
          fi
          if grep -q '^FAIL' "$LOG"; then
            cat "$LOG"
            exit 1
          fi
          if [ "${{ steps.selftest.outcome }}" != "success" ]; then
            echo "the selftest exited ${{ steps.selftest.outcome }} without a FAIL line"
            tail -40 "$LOG"
            exit 1
          fi
          echo "the selftest passed"

  security:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check the JUCE download hash
        run: |
          set -euo pipefail
          python Tools/fetch_juce.py
          python - <<'PY'
          import pathlib, re, sys
          cmake = pathlib.Path("CMakeLists.txt").read_text()
          fetch = pathlib.Path("Tools/fetch_juce.py").read_text()
          a = re.search(r"JUCE_ARCHIVE_SHA256\s+([0-9a-f]{64})", cmake)
          b = re.search(r'SHA256\s*=\s*"([0-9a-f]{64})"', fetch)
          if not a or not b:
              print("could not read the pinned JUCE hash"); sys.exit(1)
          if a.group(1) != b.group(1):
              print(f"the two JUCE hashes differ: {a.group(1)} vs {b.group(1)}"); sys.exit(1)
          print(f"the JUCE hash is pinned consistently: {a.group(1)}")
          PY

      - name: Check that the workflows are pinned to commit SHAs
        run: |
          set -euo pipefail
          bad=0
          for f in .github/workflows/*.yml; do
            # every "uses:" line must carry a 40-character commit SHA
            if grep -E '^\s*uses:\s*[^#]*@' "$f" | grep -vE '@[0-9a-f]{40}(\s*#.*)?$'; then
              echo "$f uses an action that is not pinned to a commit SHA"
              bad=1
            fi
          done
          exit $bad

      - name: Check that no secret is committed
        run: |
          set -euo pipefail
          if git ls-files | grep -iE '\.(jks|p12|pfx|keystore)$'; then
            echo "a keystore is committed - remove it"
            exit 1
          fi
          if git ls-files | grep -E 'keystore\.properties$'; then
            echo "keystore.properties is committed - remove it"
            exit 1
          fi
          echo "no keystore or signing properties are tracked"
