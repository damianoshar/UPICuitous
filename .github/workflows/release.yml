name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.1.13356709
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch JUCE
        run: python Tools/fetch_juce.py

      - name: Verify Android CMake uses fetched JUCE
        run: |
          if grep -nE 'JuceLibraryCode/(modules|include_juce|JuceHeader)' Builds/Android/app/CMakeLists.txt; then
            echo "Builds/Android/app/CMakeLists.txt still points at generated JuceLibraryCode."
            echo "Run scripts/fix_android.ps1 after a Projucer resave, then commit the result."
            exit 1
          fi

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(command -v sdkmanager || find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true

      - name: Install NDK and CMake
        run: |
          SDKMANAGER="$(command -v sdkmanager || find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n1)"
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" \
            "ndk;28.1.13356709" \
            "cmake;3.22.1" \
            "build-tools;35.0.0" \
            "platforms;android-35"

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > Builds/Android/app/app-release.keystore
          {
            echo "storeFile=app-release.keystore"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
            echo "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}"
          } > Builds/Android/app/keystore.properties

      - name: Build release APK
        working-directory: Builds/Android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease_Release --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(find Builds/Android/app/build/outputs/apk/release_/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          VERSION=$(printf '%s' "$GITHUB_REF_NAME" | tr '/ ' '--')
          cp "$APK" "dist/UPICuitous-${VERSION}.apk"
          ls -lh dist

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: UPICuitous-Android-APK
          path: dist/*.apk
          if-no-files-found: error

  windows:
    uses: ./.github/workflows/windows.yml

  # The only job that creates or updates a GitHub release. It runs only after
  # both platform builds succeed, so the release is published exactly once.
  publish:
    needs: [android, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: UPICuitous-Android-APK
          path: dist/android

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: UPICuitous-Windows
          path: dist/windows

      - name: Generate checksums
        run: |
          cd dist
          sha256sum android/*.apk windows/*.zip \
            | sed -e 's#  android/#  #' -e 's#  windows/#  #' \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/android/*.apk
            dist/windows/*.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true
          body: |
            UPICuitous release.

            Built from `${{ github.ref_name }}`.

            Assets:
            - `UPICuitous-${{ github.ref_name }}.apk` (Android)
            - `UPICuitous-Windows.zip` (Windows standalone + VST3)
            - `SHA256SUMS.txt`

            Android install:
            ```
            adb install -r UPICuitous-*.apk
            ```

            Windows: unzip `UPICuitous-Windows.zip`, then run
            `UPICuitous.exe` or copy `UPICuitous.vst3` to your VST3 folder.
