name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.1.13356709
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch JUCE
        run: python Tools/fetch_juce.py

      - name: Verify Android CMake uses fetched JUCE
        run: |
          if grep -nE 'JuceLibraryCode/(modules|include_juce|JuceHeader)' Builds/Android/app/CMakeLists.txt; then
            echo "Builds/Android/app/CMakeLists.txt still points at generated JuceLibraryCode."
            echo "Run scripts/fix_android.ps1 after a Projucer resave, then commit the result."
            exit 1
          fi

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(command -v sdkmanager || find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true

      - name: Install NDK and CMake
        run: |
          SDKMANAGER="$(command -v sdkmanager || find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n1)"
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" \
            "ndk;28.1.13356709" \
            "cmake;3.22.1" \
            "build-tools;35.0.0" \
            "platforms;android-35"

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > Builds/Android/app/app-release.keystore
          {
            echo "storeFile=app-release.keystore"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
            echo "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}"
          } > Builds/Android/app/keystore.properties

      - name: Build release APK
        working-directory: Builds/Android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease_Release --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp Builds/Android/app/build/outputs/apk/release_/release/*.apk dist/
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UPICuitous-Android-APK
          path: dist/*.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          body: |
            UPICuitous Android release.

            Built from `${{ github.ref_name }}`.

            Install with:
            ```
            adb install -r <apk>
            ```
